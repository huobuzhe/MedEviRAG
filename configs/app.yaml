# 运行配置：进程级、与模型无关
app:
  name: medevirag
  env: dev                     # dev | test | prod
  data_dir: data
  log_level: INFO
  log_json: true               # 结构化 JSON 日志；控制台调试时可关掉


# S6 服务化（docs/07 §T1）
serve:
  host: 0.0.0.0
  port: 8000
  workers: 1                    # GPU 单例 + Milvus Lite 不支持多进程，禁多 worker
  cors_origins: ["http://127.0.0.1:5173", "http://localhost:5173"]
  cache:
    embedding_ttl_s: 604800     # 7 天：embedding 是纯函数，TTL 只防膨胀
    answer_ttl_s: 3600          # 1 小时：证据与 prompt 都可能变
  budget_ms:
    retrieval: 800
    rerank: 600
    generation: 3500
    total: 6000
  concurrency:
    max_inflight: 32
    rerank_gate: 1
    rerank_wait_ms: 400
    llm_semaphore: 8

# 无 Docker/Redis/PG 的降级开关（本机实测环境）
serve_fallback:
  redis_url: ""
  pg_dsn: ""
  audit_dir: data/logs
